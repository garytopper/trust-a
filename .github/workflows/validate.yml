name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trust-a:
    name: TRUST-A docs and Skill
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check bundled Skill references
        run: python scripts/sync-skill-references.py --check

      - name: Check maintenance scripts
        run: python -m compileall -q scripts
